name: Buy evals

# Runs the evals in evals/ against the live buy tool four times a day, and on demand from the Actions tab.
# An eval that does not pass is posted to Slack by evals/lib/slack-reporter.ts, so this job turns red only
# when the run itself breaks.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buy-evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run the evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENTCARD_CLIENT_ID: ${{ secrets.AGENTCARD_CLIENT_ID }}
          AGENTCARD_CLIENT_SECRET: ${{ secrets.AGENTCARD_CLIENT_SECRET }}
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          AGNOST_ORG_ID: ${{ secrets.AGNOST_ORG_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_EVALS_CHANNEL: ${{ vars.SLACK_EVALS_CHANNEL }}
        # Exit code 1 means an eval did not pass, which Slack already reports. Anything else is a broken run.
        run: npx eve eval --strict || [ $? -eq 1 ]
